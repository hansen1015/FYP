; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-supermini]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

; The ESP32-S3 Super Mini has 4MB of flash, but the generic
; esp32-s3-devkitc-1 board definition defaults to 8MB, which generates
; a partition table too big for the actual chip (boot loop / "partition
; invalid" error). Override it here to match the real hardware.
board_build.flash_size = 4MB
board_build.partitions = default.csv

; ESP32-S3 Super Mini uses native USB (no separate USB-UART chip),
; so USB CDC must be enabled to get Serial output over the USB port.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
